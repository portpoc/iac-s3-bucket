name: Terraform Apply

on:
  push:
    branches: [main]
    paths:
      - 'modules/aws-s3-bucket/**'
  workflow_dispatch:
    inputs:
      bucket_name:
        description: "The name of the S3 data bucket. Must be globally unique across AWS."
        type: string
        required: true
      environment:
        description: "Deployment environment."
        type: choice
        options: [dev, tst, qua, ppr, prd]
        required: true
      owner:
        description: "Team or individual responsible for this bucket (DSV required tag: owner)."
        type: string
        required: true
      cost_center:
        description: "Cost center code for billing (DSV required tag: cost-center)."
        type: string
        required: true
      region:
        description: "AWS region where the bucket will be created. Must be a DSV-approved region."
        type: choice
        options: [eu-west-1, eu-central-1, us-east-1, us-west-2]
        default: eu-west-1
        required: false

permissions:
  id-token: write
  contents: read

env:
  TF_CLI_CONFIG_FILE: $HOME/.terraformrc
  TF_WORKING_DIR: modules/aws-s3-bucket

jobs:
  guardrail-check:
    name: Guardrail Evaluation
    runs-on: ubuntu-latest
    outputs:
      decision: ${{ steps.guardrail.outputs.decision }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run security guardrails (tfsec)
        run: |
          docker run --rm \
            -v $(pwd)/modules/aws-s3-bucket:/src \
            aquasec/tfsec /src --format json > modules/aws-s3-bucket/tfsec-results.json || true

      - name: Evaluate guardrail decision
        id: guardrail
        run: |
          HIGH=$(cat modules/aws-s3-bucket/tfsec-results.json \
            | jq '[.results[] | select(.severity=="HIGH" or .severity=="CRITICAL")] | length' \
            2>/dev/null || echo 0)
          if [ "$HIGH" -gt 0 ]; then
            echo "decision=escalate" >> $GITHUB_OUTPUT
          else
            echo "decision=proceed" >> $GITHUB_OUTPUT
          fi

  apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: guardrail-check
    if: needs.guardrail-check.outputs.decision == 'proceed'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Artifactory Terraform registry
        run: |
          cat > $HOME/.terraformrc << 'EOF'
          provider_installation {
            direct {
              exclude = ["registry.terraform.io/*/*"]
            }
            network_mirror {
              url = "https://artifactory.dsv.com/artifactory/api/terraform/terraform-providers-remote/providers/"
            }
          }
          EOF

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_APPLY_ROLE_ARN }}
          role-session-name: terraform-apply-${{ github.run_id }}
          aws-region: ${{ github.event.inputs.region || 'eu-west-1' }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.5"

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=aws-s3-bucket/${{ github.event.inputs.environment }}/terraform.tfstate" \
            -backend-config="region=eu-west-1" \
            -backend-config="dynamodb_table=${{ secrets.TF_STATE_LOCK_TABLE }}"

      - name: Terraform Apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform apply -auto-approve \
            -var="bucket_name=${{ github.event.inputs.bucket_name }}" \
            -var="environment=${{ github.event.inputs.environment }}" \
            -var="owner=${{ github.event.inputs.owner }}" \
            -var="cost_center=${{ github.event.inputs.cost_center }}" \
            -var="region=${{ github.event.inputs.region || 'eu-west-1' }}"

  refuse-apply:
    name: Refuse Apply (guardrail escalation)
    runs-on: ubuntu-latest
    needs: guardrail-check
    if: needs.guardrail-check.outputs.decision != 'proceed'
    steps:
      - name: Fail with guardrail reason
        run: |
          echo "::error::Apply refused by guardrail evaluation. Decision: ${{ needs.guardrail-check.outputs.decision }}"
          exit 1
